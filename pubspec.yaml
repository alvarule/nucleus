name: nucleus
description: Nucleus — zero-knowledge password manager
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  supabase_flutter: ^2.9.0
  flutter_secure_storage: 11.0.0
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  flutter_svg: ^2.1.0
  lottie: ^3.3.1
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  screen_protector: ^1.4.2
  collection: ^1.19.1
  uuid: ^4.5.1
  path: ^1.9.1
  intl: ^0.20.2
  equatable: ^2.0.7
  shared_preferences: ^2.5.5
  app_links: ^6.4.0
  connectivity_plus: ^7.3.1
  flutter_sticky_header: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/animations/
    - assets/icons/
    - assets/avatars/
